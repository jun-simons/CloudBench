# Faraday waves: a small water-filled petri dish is shaken up and down by the
# vibration exciter; above a threshold amplitude, standing waves appear on the
# surface at half the drive frequency. The camera looks down at the dish.
#
# Text marked TODO:text is placeholder copy, to be written in a later pass.
apiVersion: cloudbench/v1
kind: Experiment
id: exp_faraday_waves
version: 2
title: "Faraday Waves Experiment"
summary: "Create standing Faraday waves and observe different lattice patterns."
audience: [high-school, intro-physics]
estimated_duration_s: 120

requirements:
  tools:
    exciter:
      type: vibration-exciter
      actions: [play_tone, set_tone, stop]
    observer:
      type: camera
      streams: [video]

# JSON Schema per parameter; the web app renders these as controls.
# "x-unit", "x-step" and "x-format" (percent: show 0.3 as 30%) are display hints
# and are ignored by validation.
parameters:
  frequency_hz:
    type: number
    title: Frequency
    description: "Frequency of the speaker. The resulting wave frequency should be half this."
    minimum: 10
    maximum: 120
    default: 40
    x-unit: Hz
    x-step: 0.5
  amplitude:
    type: number
    title: Amplitude
    description: "Amplitude, or volume, of the speaker. A larger amplitude results in taller waves."
    minimum: 0
    maximum: 0.25
    default: 0.2
    x-format: percent
    x-step: 0.01
  shape:
    type: string
    title: Wave shape
    enum: [sine, square, triangle, sawtooth]
    default: sine
  duration_s:
    type: number
    title: Duration
    description: "How long to vibrate for."
    minimum: 1
    maximum: 180
    default: 30
    x-unit: s

# The web app's live controls: switching the vibrator on calls `start` with the
# parameters below, moving a control calls `update`, switching off calls `stop`.
live:
  role: exciter
  parameters: [frequency_hz, amplitude, shape]
  start: play_tone
  update: set_tone
  stop: stop

# Placeholder values: replace with settings found to look good on the real dish.
# `icon` picks the picture drawn on the preset's button (see PresetIcon in the web app).
presets:
  gentle:
    label: "Gentle waves"
    icon: ripples
    values: {frequency_hz: 25, amplitude: 0.08, shape: sine}
  squares:
    label: "Square lattice"
    icon: square-lattice
    values: {frequency_hz: 40, amplitude: 0.14, shape: sine}
  fine:
    label: "Fine lattice"
    icon: fine-lattice
    values: {frequency_hz: 80, amplitude: 0.19, shape: sine}
  chaos:
    label: "Chaotic waves"
    icon: chaos
    values: {frequency_hz: 50, amplitude: 0.22, shape: square}

# A timed run, for the API and AI agents: plays the chosen tone for duration_s.
procedure:
  - show: observer.video
  - run: exciter.play_tone
    input:
      shape: "{{ params.shape }}"
      frequency_hz: "{{ params.frequency_hz }}"
      amplitude: "{{ params.amplitude }}"
      duration_s: "{{ params.duration_s }}"

# Markdown. A link to preset:<id> renders as a button that applies that preset;
# the link text is the button label (leave it empty to use the preset's label).
notes: |
  ## Meet the Workbench

  You're looking down at a dish of water mounted on top of a subwoofer. The subwoofer acts as a mechanical vibrator, sending controlled vertical vibrations through the dish and into the water. By changing the frequency and amplitude of these vibrations, we can dramatically change how the water behaves.

  At certain frequencies, the water develops **Faraday waves**: stripes, squares, and other standing wave patterns that emerge on the fluid's surface. What you're seeing is a real phenomenon a real workbench!

  ## Experiment with Presets

  Not sure where to start? Try one of the presets below to explore different behaviors of the water. Each preset configures the workbench to produce a different wave pattern. Watch the live camera feed as the experiment settles, and see how changing the vibration parameters transforms the surface.

  - [](preset:gentle) Start with subtle vibrations. Look closely for patterns as the water transitions from a relatively flat surface into an organized wave pattern.
  - [](preset:squares) Look for a regular, grid-like arrangement of peaks and troughs. Notice how the waves organize themselves into a repeating square pattern.
  - [](preset:fine) Observe smaller, more closely spaced wave patterns. Pay attention to how the scale of the patterns differs from the other presets.
  - [](preset:chaos) Explore a less orderly regime. Look for irregular patterns and competing wave structures.

  ## Questions to Explore

  Try changing the experimental parameters to see if you can discover relationships between the vibrations and the patterns they produce.

  - **Frequency vs. spacing:** How does the distance between wave peaks (known as their wavelength) change as you increase the vibration frequency?
  - **The onset of waves:** How much amplitude is required before standing waves first appear? Does this threshold change with frequency?
  - **Pattern formation:** Why do some settings produce stripes while others produce squares or more complex patterns?
  - **Unexpected discoveries:** Can you find a combination of settings that produces a pattern you haven't seen before?

  Beyond their fascinating patterns, Faraday waves have promising applications in biomedical engineering, where researchers use them to organize living cells, assemble multicellular spheroids, and engineer complex tissues for regenerative medicine.