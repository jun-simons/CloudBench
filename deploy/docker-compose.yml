# Gateway deployment for a cloud VM: the gateway plus Caddy for automatic HTTPS.
#
#   cp deploy/.env.example deploy/.env    # then fill in secrets and your domain
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Point the workbench agent at https://$CLOUDBENCH_DOMAIN.

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - gateway-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gateway-data:
  caddy-data:
  caddy-config:
