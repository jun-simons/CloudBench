# Workbench agent config. Copy to agent.local.yaml (git-ignored) and edit.
# The secret comes from the CLOUDBENCH_AGENT_SECRET environment variable and must
# match this workbench's entry in the gateway's CLOUDBENCH_AGENT_SECRETS.

gateway_url: http://localhost:8000
workbench_id: wb_faraday
name: "TODO:text - workbench name"
description: "TODO:text - one-line workbench description"

vibrator:
  # "sounddevice" plays through an audio output into the exciter's amplifier;
  # "mock" simulates playback for development without hardware.
  driver: mock
  # Output device name or index from `python -m sounddevice`; omit for the default.
  # device: "USB Audio"
  # Hard limits enforced on the laptop, whatever the gateway or UI asks for.
  max_duration_s: 180
  max_gain: 1.0
  min_frequency_hz: 1
  max_frequency_hz: 2000

camera:
  # "opencv" reads any camera the OS exposes (USB webcam, an iPhone via Continuity
  # Camera on macOS, a capture card); "mock" draws a simulated petri dish.
  driver: mock
  device: 0
  width: 1280
  height: 720
  fps: 30
  jpeg_quality: 80

vision:
  # Analysis actions on the camera tool (detect_points, fourier, delaunay, analyze, activity).
  enabled: true
  # Inner diameter of the dish, to convert pixels to millimetres.
  cup_diameter_mm: 68
  # Annotated streams (points, delaunay, spectrum) analysed at most this often. 0 = off.
  stream_fps: 0
